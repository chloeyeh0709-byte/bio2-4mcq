<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物筆記 ・ 基因轉殖多選題本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfaf1;
    --line:#cfe8ff;
    --ink:#3a3a3a;
    --accent:#ff8fab;
    --accent2:#7bd389;
    --highlight:#fff3a0;
    --margin-line:#ffb3c1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(
        to bottom,
        var(--paper) 0px,
        var(--paper) 31px,
        var(--line) 32px
      );
    background-color:var(--paper);
    min-height:100vh;
    padding-left:60px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    top:0; left:48px;
    width:2px; height:100%;
    background:var(--margin-line);
    z-index:0;
  }
  .container{
    max-width:880px;
    margin:0 auto;
    padding:24px 28px 80px;
    position:relative;
    z-index:1;
  }
  h1{
    font-family:'Zhi Mang Xing', cursive;
    font-size:2.4rem;
    color:#5b6cff;
    text-align:center;
    margin-bottom:4px;
    transform:rotate(-1deg);
  }
  .subtitle{
    text-align:center;
    color:#999;
    margin-bottom:32px;
    font-size:0.95rem;
  }
  .tape{
    display:inline-block;
    background:var(--highlight);
    padding:2px 14px;
    transform:rotate(-2deg);
    box-shadow:1px 1px 3px rgba(0,0,0,0.15);
    font-family:'Zhi Mang Xing', cursive;
  }
  /* HOME PAGE */
  #home .deck-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:24px;
    margin-top:24px;
  }
  .deck-card{
    background:#fff;
    border:2px dashed #b8c6ff;
    border-radius:14px;
    padding:24px 18px;
    text-align:center;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:3px 4px 0 rgba(0,0,0,0.05);
    position:relative;
  }
  .deck-card:hover{
    transform:translateY(-4px) rotate(-1deg);
    box-shadow:5px 8px 0 rgba(91,108,255,0.15);
  }
  .deck-card .deck-emoji{
    font-size:2.6rem;
    display:block;
    margin-bottom:8px;
  }
  .deck-card h2{
    font-family:'Zhi Mang Xing', cursive;
    font-size:1.6rem;
    margin:6px 0;
    color:#444;
  }
  .deck-card p{
    font-size:0.85rem;
    color:#888;
    margin:0;
  }

  /* QUIZ PAGE */
  .back-btn{
    background:none;
    border:2px solid #b8c6ff;
    border-radius:10px;
    padding:6px 16px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:0.9rem;
    cursor:pointer;
    color:#5b6cff;
    margin-bottom:16px;
  }
  .back-btn:hover{background:#eef2ff;}

  .progress-bar{
    height:10px;
    background:#eee;
    border-radius:6px;
    overflow:hidden;
    margin:8px 0 20px;
    border:1px solid #ddd;
  }
  .progress-fill{
    height:100%;
    background:var(--accent2);
    width:0%;
    transition:width .3s ease;
  }

  .q-card{
    background:#fff;
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:22px;
    box-shadow:2px 3px 6px rgba(0,0,0,0.06);
    border-left:6px solid var(--accent);
    position:relative;
  }
  .q-card .q-num{
    font-family:'Zhi Mang Xing', cursive;
    font-size:1.3rem;
    color:var(--accent);
    margin-right:6px;
  }
  .q-card .q-meta{
    font-size:0.78rem;
    color:#aaa;
    margin-left:6px;
  }
  .q-text{
    margin:8px 0 14px;
    line-height:1.8;
    font-size:1.02rem;
    white-space:pre-line;
  }
  .fig-note{
    background:var(--highlight);
    border-radius:8px;
    padding:10px 14px;
    font-size:0.88rem;
    color:#7a6a00;
    margin:8px 0 14px;
    border:1px dashed #e0cf60;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s;
    line-height:1.6;
  }
  .option:hover{background:#f5f7ff;}
  .option input{
    margin-top:4px;
    width:18px; height:18px;
    accent-color:var(--accent);
    flex-shrink:0;
  }
  .option .opt-label{
    font-weight:700;
    color:#5b6cff;
    flex-shrink:0;
  }
  .q-card.checked .option.correct-choice{
    background:#e6f9ec;
    border-color:var(--accent2);
  }
  .q-card.checked .option.missed-choice{
    background:#fff0f0;
    border-color:#ff8fab;
    outline:2px dashed #ff8fab;
  }
  .q-card.checked .option.wrong-choice{
    background:#fff0f0;
    border-color:#ff6b6b;
    text-decoration:line-through;
    color:#c0392b;
  }
  .btn-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:6px;
  }
  .check-btn{
    background:var(--accent2);
    color:#fff;
    border:none;
    border-radius:20px;
    padding:8px 22px;
    font-size:0.95rem;
    cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
    box-shadow:1px 2px 0 rgba(0,0,0,0.1);
  }
  .check-btn:hover{filter:brightness(1.05);}
  .check-btn:disabled{background:#ccc; cursor:default;}
  .result-tag{
    font-family:'Zhi Mang Xing', cursive;
    font-size:1.2rem;
    padding:4px 14px;
    border-radius:20px;
  }
  .result-tag.correct{background:#e6f9ec; color:#2f9e57;}
  .result-tag.wrong{background:#ffe6ea; color:#e1507a;}
  .answer-key{
    margin-top:8px;
    font-size:0.85rem;
    color:#888;
  }
  .explanation{
    margin-top:12px;
    background:#f4f7ff;
    border-radius:8px;
    padding:12px 14px;
    font-size:0.92rem;
    line-height:1.75;
    color:#555;
    display:none;
    white-space:pre-line;
    border-left:4px solid #b8c6ff;
  }
  .q-card.checked .explanation{display:block;}

  .summary-card{
    background:#fff;
    border-radius:14px;
    padding:24px;
    text-align:center;
    border:2px dashed var(--accent2);
    margin-top:10px;
  }
  .summary-card h2{
    font-family:'Zhi Mang Xing', cursive;
    font-size:1.8rem;
    color:#444;
  }
  .summary-score{
    font-size:2.2rem;
    color:var(--accent2);
    font-weight:700;
    margin:10px 0;
  }
  .reset-btn{
    background:#5b6cff;
    color:#fff;
    border:none;
    border-radius:20px;
    padding:10px 26px;
    font-size:1rem;
    cursor:pointer;
    margin-top:10px;
    font-family:'Noto Sans TC', sans-serif;
  }
  .doodle{
    position:absolute;
    font-size:1.4rem;
    opacity:0.5;
  }
  .hidden{display:none !important;}
  footer{
    text-align:center;
    color:#bbb;
    font-size:0.8rem;
    margin-top:30px;
  }
</style>
</head>

<div class="container">

  <!-- HOME -->
  <div id="home">
    <p style="text-align:center;"><span class="tape">選一份開始作答吧 ✏️</span></p>

      <div class="deck-card" data-set="0" onclick="openSet(0)">

        <span class="deck-emoji">📘</span>
        <h2>第二份</h2>
        <p>第 11～20 題</p>
      </div>
      <div class="deck-card" data-set="2" onclick="openSet(2)">

  <!-- QUIZ -->
  <div id="quiz" class="hidden">

      <button class="reset-btn" onclick="resetSet()">再寫一次這份</button>
    </div>
  </div>

  <footer>整理自基因轉殖與重組 DNA 相關考題・祝考試順利 🍀</footer>

<script>
const QUESTIONS = [
{num:1, multi:2, text:"觀測使用的複式顯微鏡最大放大倍率為 400 倍，將採樣奇異果的果肉組織置於顯微鏡下進行細胞觀察與測量，並再另取果肉組織進行 DNA 萃取實驗，下列關於實驗操作及實驗結果的敘述，哪些正確？（應選 2 項）",
options:{
A:"綠色果肉置於顯微鏡下觀察可見到細胞內有綠色顆粒，顆粒內應該會有 ATP 的生成",
B:"隨著倍率放大，顯微鏡視野下測微器刻度線之間的距離不會隨著綠色顆粒一同放大",
C:"隨著倍率放大，視野下可見到細胞內的內質網構造會放大，但測量計算的結果顯示內質網大小不變",
D:"果泥水溶液加入高濃度食鹽水以促進染色質析出，再加入木瓜酵素來分解染色質的蛋白質",
E:"萃取最後加入 95% 冰酒精並攪動混合均勻，可促進 DNA 凝聚析出。"
},
answer:["A","B"],
explain:"(A)綠色顆粒應為葉綠體，光反應會有 ATP 的生成。\n(B)顯微鏡視野下可見到目鏡測微器刻度線，刻度線之間的距離不會隨著倍率放大而改變。\n(C)光學顯微鏡 400 倍放大倍率無法觀察到細胞內的內質網構造。\n(D)果泥水溶液加入高濃度食鹽水促進 DNA 溶解與其他雜質分離，再加入木瓜酵素有助於分解染色質的蛋白質。\n(E)萃取最後應該沿容器壁緩慢加入 95% 冰酒精，不可攪動使液面分層，DNA 才能凝聚析出於上層酒精中。"
},
{num:2, multi:2, text:"下列關於人體口腔上皮細胞 DNA 粗萃取的實驗過程與目的，哪些正確？",
options:{
A:"將沾在棉花棒上的上皮細胞置入生理食鹽水中攪拌的目的是破壞細胞膜",
B:"加入清潔劑攪拌的目的是破壞內膜系統的膜，將染色質釋出",
C:"加入嫩精或鳳梨汁攪拌的目的是分解染色質上的蛋白質",
D:"加入冰酒精的目的是使蛋白質變性",
E:"加入濃食鹽水的目的是使 DNA 凝聚析出。"
},
answer:["B","C"],
explain:"(A)目的是讓上皮細胞脫落於生理食鹽水中，生理食鹽水是等張溶液，細胞不會脹破。\n(D)冰酒精可使 DNA 凝聚析出。\n(E)濃食鹽水可溶解 DNA。"
},
{num:3, multi:2, text:"現今科學家已能進行基因剪接，使基因跨物種重組。此項生物科技的成功有賴於下列哪些酵素的作用？（應選 2 項）",
options:{
A:"限制酶",
B:"DNA 聚合酶",
C:"RNA 聚合酶",
D:"DNA 連接酶",
E:"RNA 連接酶。"
},
answer:["A","D"],
explain:"限制酶可以切斷 DNA，DNA 連接酶可以連接 DNA，藉由這兩種酶，科學家可以進行基因剪接，使基因跨物種重組。"
},
{num:4, multi:4, text:"基因改造食品被要求應有明顯標示，這是因為人們對基因改造食品有下列哪些疑慮之故？（應選 4 項）",
options:{
A:"是否可能危及食用者健康",
B:"外來基因進入人體後是否可能嵌入細胞的染色體中",
C:"外來基因是否可能干擾正常基因的活動",
D:"使用的載體是否可能突變而致病",
E:"是否會增強食用者的免疫能力。"
},
answer:["A","B","C","D"],
explain:"(E)是否為基因改造食品與增強食用者的免疫能力無關。"
},
{num:5, multi:2, text:"重組 DNA 是利用人工方式將不同來源的 DNA 剪接在一起，可以利用此技術合成特定的藥物以治療疾病。下列有關此技術的敘述，哪些正確？（應選 2 項）",
options:{
A:"需要載體攜帶目標基因",
B:"需要外加 DNA 連接酶，進行 DNA 的接合",
C:"需要外加 RNA 聚合酶，合成基因表現的產物",
D:"需要選用能抗抗生素的宿主細胞，以利篩選含重組 DNA 的細胞",
E:"合成的藥物都是醣類。"
},
answer:["A","B"],
explain:"(A)(B)重組 DNA 的步驟：①從細菌分離出質體→②使用相同限制酶切割質體與目標基因→③使用 DNA 連接酶將質體與目標基因接合形成重組 DNA→④將質體轉殖進入新的細胞→⑤在培養基中加入抗生素以選殖轉殖成功的細菌。\n(C)重組 DNA 的過程中無需外加 RNA 聚合酶。\n(D)步驟④中，轉殖質體所進入新的細胞本身不具有質體（即不具有抗抗生素的特性），新的細胞是當重組 DNA 成功轉殖進入細胞後，才會具有抗抗生素的特性，方能在具抗生素的培養基中選殖轉殖成功的細胞。\n(E)合成的藥物為目標基因產物，成分是蛋白質。"
},
{num:6, multi:2, text:"下列實驗步驟與原理，哪些正確？（應選 2 項）【110.全模】",
options:{
A:"在複式顯微鏡下觀察到的細胞質液為逆時針流動，則實際為順時針流動",
B:"若目鏡測微器 20 小格相當於載物臺測微器 5 小格，測得水蚤寬度占目鏡測微器 8 小格，則水蚤寬度為 320 μm",
C:"觀察洋蔥根尖的細胞，可發現大部分的細胞處於間期",
D:"在 DNA 粗萃取實驗中，使用冰酒精可抑制蛋白酶的活性，以利 DNA 析出",
E:"使用顯微鏡時，當從 4X 物鏡轉換到 10X 物鏡，將光圈放大可有利於觀察。"
},
answer:["C","E"],
explain:"(A)複式顯微鏡成像為上下顛倒、左右相反，故看到逆時針流動的細胞質液，則實際流動方向亦為逆時針。\n(B)目鏡測微器 1 小格＝10 μm×（載物臺測微器格數/目鏡測微器格數）＝10 μm×（5/20）＝2.5 μm，故水蚤寬度為 8×2.5 μm＝20 μm。\n(D)DNA 難溶於酒精，使用冰酒精可將 DNA 凝聚以利析出。"
},
{num:7, multi:2, text:"生長激素對兒童非常重要，若缺少可能導致成長速度非常緩慢，使其成年時身高約只有 122～146 cm，但若能及時補充，即可使其身高到達正常範圍。生長激素取得不易，在 1985 年以前需從死者的腦垂腺萃取，十分稀少珍貴；直到 1985 年以後，可由基因工程改造的細菌製造出人類生長激素，才增加了治癒的機率。若想利用細菌生產人類生長激素，下列進行步驟哪些正確？（應選 2 項）",
options:{
A:"可利用相同的限制酶，裁切人類與細菌載體（質體）的 DNA 片段",
B:"利用限制酶裁切人類與細菌的 DNA 片段時，均需有 2 個切點",
C:"可利用特殊的連接酶，黏接人類與細菌被裁切下來的 DNA 片段，形成重組 DNA",
D:"在試管中加入此重組 DNA、RNA 聚合酶、核糖體培養，即可合成人類生長激素",
E:"將重組 DNA 及細菌放入培養基中一起培養一段時間後，所有細菌均可合成人類生長激素。"
},
answer:["A","C"],
explain:"(B)限制酶裁切細菌載體（質體）時，因質體為環狀 DNA，可以僅有 1 個切點。\n(D)重組 DNA 需轉殖入宿主細胞，才能進行基因表現。\n(E)並非所有宿主細胞均能成功進行基因轉殖，只有成功轉殖入重組 DNA 的細菌才能合成人類生長激素。"
},
{num:8, multi:4, text:"下列關於基因轉殖的操作過程，哪些正確？（應選 4 項）",
options:{
A:"常以細菌的質體或病毒的 DNA 為載體",
B:"載體可將外源基因引入他種生物細胞中",
C:"利用 DNA 聚合酶將基因自染色體切下",
D:"外源基因和載體組成重組 DNA",
E:"重組 DNA 在基因轉殖生物體內需能複製、轉錄、轉譯，才算成功。"
},
answer:["A","B","D","E"],
explain:"(C)DNA 聚合酶是在 DNA 進行複製時，才會使用到，而將基因自染色體切下要利用特殊酵素。"
},
{num:9, multi:4, text:"下列對於基因轉殖技術的相關敘述，哪些正確？（應選 4 項）",
options:{
A:"轉殖基因在生物體內表現，常可突破生物種類的界線",
B:"轉殖抗蟲基因進入蔬果作物中，可減少農藥的使用",
C:"人類胰島素可由基改大腸桿菌製造",
D:"將維生素 B 打入蔬果作物中，可促進其維生素 B 的合成",
E:"了解基因的位置及功能是基因轉殖技術所需的背景知識。"
},
answer:["A","B","C","E"],
explain:"(D)要將製造維生素 B 的基因打入蔬果作物中，才可促進作物合成維生素 B。"
},
{num:10, multi:2, text:"下列為「DNA 的粗萃取」活動中所用的溶液，在本活動中其用途為何？（應選 2 項）",
options:{
A:"清潔劑—破壞細胞壁",
B:"清潔劑—破壞細胞膜和核膜",
C:"2 M 食鹽水—沉澱 DNA",
D:"鳳梨汁—分解蛋白質",
E:"冰酒精—溶解 DNA。"

},
answer:["C","D"],
explain:"(A)(B)(E)與抗蟲蛋白質的種類及含量比較無關。\n(C)細菌 Bt 基因之產物為抗蟲蛋白質，廠商要做的試驗項目為抗蟲蛋白質的種類及含量比較，因此了解基改大豆中是否產生可能引發毒性的新物質為蛋白質種類的試驗項目。\n(D)了解基改大豆中致敏性高的蛋白質是否增加為蛋白質含量的試驗項目。"
}
];

const SETS = [
  {title:"📗 第一份（第 1～10 題）", range:[0,10]},
  {title:"📘 第二份（第 11～20 題）", range:[10,20]},
  {title:"📙 第三份（第 21～30 題）", range:[20,30]}
];

let currentSet = null;

function openSet(idx){
  currentSet = idx;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('quiz-title').textContent = SETS[idx].title;
  renderQuiz();
  window.scrollTo(0,0);
}

function goHome(){
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('quiz').classList.add('hidden');
  currentSet = null;
}

function renderQuiz(){
  const [start,end] = SETS[currentSet].range;
  const qs = QUESTIONS.slice(start,end);
  const container = document.getElementById('questions');
  container.innerHTML = '';
  document.getElementById('summary').classList.add('hidden');

  qs.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-'+q.num;

    let html = `<div><span class="q-num">第 ${q.num} 題</span><span class="q-meta">（應選 ${q.multi} 項）</span></div>`;
    html += `<div class="q-text">${q.text}</div>`;
    if(q.figNote){
      html += `<div class="fig-note">🖼️ ${q.figNote}</div>`;
    }
    html += `<div class="options">`;
    for(const [key,val] of Object.entries(q.options)){
      html += `<label class="option" data-key="${key}">
        <input type="checkbox" name="q${q.num}" value="${key}">
        <span class="opt-label">(${key})</span><span>${val}</span>
      </label>`;
    }
    html += `</div>`;
    html += `<div class="btn-row">
      <button class="check-btn" onclick="checkAnswer(${q.num})">對答案 ✅</button>
      <span class="result-tag hidden" id="result-${q.num}"></span>
    </div>`;
    html += `<div class="answer-key">正確答案：(${q.answer.join(')(')})</div>`;
    html += `<div class="explanation">📝 解析：\n${q.explain}</div>`;

    card.innerHTML = html;
    container.appendChild(card);
  });

  updateProgress();
}

function checkAnswer(num){
  const q = QUESTIONS.find(x=>x.num===num);
  const card = document.getElementById('card-'+num);
  const selected = Array.from(card.querySelectorAll(`input[name="q${num}"]:checked`)).map(el=>el.value);

  const correctSet = new Set(q.answer);
  const selectedSet = new Set(selected);

  let isCorrect = correctSet.size === selectedSet.size && [...correctSet].every(k=>selectedSet.has(k));

  card.querySelectorAll('.option').forEach(opt=>{
    const key = opt.dataset.key;
    opt.classList.remove('correct-choice','missed-choice','wrong-choice');
    const isAns = correctSet.has(key);
    const isSel = selectedSet.has(key);
    if(isAns && isSel) opt.classList.add('correct-choice');
    else if(isAns && !isSel) opt.classList.add('missed-choice');
    else if(!isAns && isSel) opt.classList.add('wrong-choice');
  });

  card.classList.add('checked');

  const tag = document.getElementById('result-'+num);
  tag.classList.remove('hidden','correct','wrong');
  if(isCorrect){
    tag.textContent = '答對了 🌟';
    tag.classList.add('correct');
  } else {
    tag.textContent = '再檢查一下 🔍';
    tag.classList.add('wrong');
  }

  card.querySelectorAll(`input[name="q${num}"]`).forEach(el=>el.disabled=true);
  card.querySelector('.check-btn').disabled = true;

  updateProgress();
  checkAllDone();
}

function updateProgress(){
  const [start,end] = SETS[currentSet].range;
  const total = end-start;
  const checked = document.querySelectorAll('#questions .q-card.checked').length;
  document.getElementById('progress-fill').style.width = (checked/total*100)+'%';
}

function checkAllDone(){
  const [start,end] = SETS[currentSet].range;
  const total = end-start;
  const checked = document.querySelectorAll('#questions .q-card.checked').length;
  if(checked === total){
    let correct = 0;
    document.querySelectorAll('#questions .q-card').forEach(card=>{
      const tag = card.querySelector('.result-tag');
      if(tag.classList.contains('correct')) correct++;
    });
    document.getElementById('summary-score').textContent = `${correct} / ${total}`;
    const msgs = ["繼續加油！再多複習幾次 💪","已經很棒了，再衝一下 🚀","太厲害了，滿分學霸 🏆"];
    let msg = msgs[0];
    if(correct===total) msg = msgs[2];
    else if(correct >= total*0.7) msg = msgs[1];
    document.getElementById('summary-msg').textContent = msg;
    document.getElementById('summary').classList.remove('hidden');
  }
}

function resetSet(){
  renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
</body>
</html>
